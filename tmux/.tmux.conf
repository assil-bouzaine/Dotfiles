# TERMINAL
set -g default-terminal "tmux-256color"
set -su terminal-features                      # reset first so reloading does not append it again
set -as terminal-features ",xterm-kitty:RGB"   # true color in kitty

# GENERAL
set -s escape-time 0          # Remove delay for key sequences
set -s set-clipboard on
set -g mouse on               # Enable mouse support (including scrolling)
set -g base-index 1           # Start window numbering from 1
setw -g pane-base-index 1     # ...and pane numbering
set -g renumber-windows on    # No gaps after closing a window
set -g history-limit 50000    # Scrollback lines per pane
set -g focus-events on        # Lets vim's autoread notice changed files

# COPY MODE
set-window-option -g mode-keys vi

# Gray highlight in copy mode
set -g mode-style 'bg=#3a3a3a,fg=#cdd6f4'

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
  'sh -c "[ -n \"$WAYLAND_DISPLAY\" ] && wl-copy || xclip -in -selection clipboard"'

# Ctrl+c to copy selection and exit copy mode
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel \
  'sh -c "[ -n \"$WAYLAND_DISPLAY\" ] && wl-copy || xclip -in -selection clipboard"'

# STATUS BAR  (Catppuccin Mocha text colors on kitty's background)
# Same palette as the fzf pickers: accent #89b4fa, muted #6c7086, pill #313244.
# Rounded pills use Nerd Font glyphs  (left cap) and  (right cap).
set -g status-style                'bg=#131313 fg=#cdd6f4'
set -g status-justify              left
set -g status-left-length          40
set -g status-right-length         80

# Session pill: blue, turns yellow while the prefix key is held
set -g @pill_bg                    '#{?client_prefix,#f9e2af,#89b4fa}'
set -g status-left                 "#[fg=#{E:@pill_bg},bg=#131313]#[fg=#131313,bg=#{E:@pill_bg},bold] #S#[fg=#{E:@pill_bg},bg=#131313,nobold] "

# Windows: muted text, the current one in a pill; 󰊓 marks a zoomed pane
set -g window-status-separator     ''
set -g window-status-format        "#[fg=#6c7086]  #I #W#{?window_zoomed_flag, 󰊓,}  "
set -g window-status-current-format "#[fg=#313244]#[fg=#89b4fa,bg=#313244,bold] #I #[fg=#cdd6f4]#W#{?window_zoomed_flag, 󰊓,}#[fg=#313244,bg=#131313,nobold]"
set -g window-status-current-style 'none'   # tmux 3.8 underlines the current window by default
set -g window-status-bell-style    'fg=#f38ba8,bold'
set -g window-status-activity-style 'fg=#f9e2af'

# Right: agents that need you (prefix Space jumps there) · date · clock pill
set -g status-right                "#(~/.local/bin/agent-status)#[fg=#6c7086,nobold]󰃭 %a %d %b  #[fg=#313244]#[fg=#89b4fa,bg=#313244] %H:%M:%S#[fg=#313244,bg=#131313]"
set -g status-interval             1   # refresh every second for the clock

# One blank line above the bar as a top margin: line 0 is an empty spacer,
# line 1 is the normal bar (tmux's default format).
set -gu status-format                       # reset first so re-sourcing copies the default
set -g  status 2
set -gF status-format[1] '#{status-format[0]}'
set -g  status-format[0] '#[fill=#131313]'

# Popups, messages and the command prompt in the same style
set -g message-style               'bg=#313244 fg=#cdd6f4'
set -g message-command-style       'bg=#313244 fg=#89b4fa'
set -g pane-border-style           'fg=#313244'
set -g pane-active-border-style    'fg=#89b4fa'

# KEYBINDINGS
bind v copy-mode
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Splits and new windows open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Alt+1..9 jumps to that window, no prefix needed (left Alt; right Alt is Ctrl)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# AGENTS  (scripts in tmux/.local/bin)
# g: open claude/codex windows on a folder in ~/Projects · a: jump to an open agent · Space: jump to the agent that needs you
# Both pickers share one popup frame; colours match the status bar
set -g popup-style        'bg=#131313'
set -g popup-border-style 'fg=#3a3a3a'
set -g popup-border-lines rounded
bind g     display-popup -E -w 90 -h 22 -T "#[fg=#89b4fa,bold] 󰉋 projects " "~/.local/bin/proj"
bind a     display-popup -E -w 90 -h 22 -T "#[fg=#89b4fa,bold] 󰚩 agents " "~/.local/bin/agent-dash"
bind Space run-shell "~/.local/bin/agent-next"   # jump to the agent that needs you
