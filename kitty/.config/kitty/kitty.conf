font_size 14
enable_audio_bell no

shell zsh
shell_integration disabled
cursor_shape block

remember_window_size no

window_padding_width 6

background_opacity 0.90
dynamic_background_opacity yes

confirm_os_window_close 0

sync_to_monitor no

# Colours and font_family come from the current theme (SUPER + CTRL + T picks
# the theme, SUPER + CTRL + F the font). Generated by ~/.local/bin/theme from
# ~/.config/theme/templates/kitty.conf.tpl; `theme` reloads every kitty.
include ~/.local/state/theme/kitty.conf
