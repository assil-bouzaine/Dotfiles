# xdg-desktop-portal-hyprland (screen sharing). Same as Omarchy 4.5:
#  - a picker with live previews of screens and windows (AUR
#    hyprland-preview-share-picker-git, styled in
#    ~/.config/hyprland-preview-share-picker/)
#  - apps get a restore token by default, so the screen / window picked once
#    is reused the next time that app shares, without asking again.
# Apply: systemctl --user restart xdg-desktop-portal-hyprland
screencopy {
    allow_token_by_default = true
    custom_picker_binary = hyprland-preview-share-picker
}
