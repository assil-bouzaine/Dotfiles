# Prefer the microphone on the laptop's 3.5 mm headset jack when detected.
# Load with: systemctl --user restart wireplumber
wireplumber.components = [
  {
    name = "90-headset-mic.lua"
    type = script/lua
    provides = hooks.device.routes.prefer-headset-mic
  }
]

wireplumber.profiles = {
  main = {
    hooks.device.routes.prefer-headset-mic = optional
  }
}
