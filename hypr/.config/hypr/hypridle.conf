general {
    lock_cmd = pidof hyprlock || hyprlock       # lock screen
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # turn on monitors after wake (Lua syntax)
}

listener {
    timeout = 10000                              # ~2h45m → lock
    on-timeout = hyprlock
}

