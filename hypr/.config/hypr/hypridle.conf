# Idle: lock, screen off, then sleep (lock / screen-off times as in Omarchy 4.5).
# The bar's "stay awake" button (eye icon left of the clock, SUPER + CTRL + I)
# holds a systemd idle inhibitor; hypridle honours it (ignore_systemd_inhibit
# is false by default), so none of the listeners below fire while it's on.
# Runs as the systemd user service hypridle.service.

general {
    lock_cmd = pidof hyprlock || hyprlock       # lock screen
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # turn on monitors after wake (Lua syntax)
}

listener {
    timeout = 300                                # 5 min → lock
    on-timeout = loginctl lock-session           # goes through lock_cmd, so no second hyprlock
}

listener {
    timeout = 330                                # 5.5 min → screens off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800                               # 30 min → sleep
    on-timeout = systemctl suspend
}
