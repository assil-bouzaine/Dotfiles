# Lock screen (SUPER + L, hypridle, before sleep)
# Font, colours and wallpaper follow the current theme (SUPER + CTRL + T / F):
# the file sourced below is generated by ~/.local/bin/theme from
# ~/.config/theme/templates/hyprlock.conf.tpl and defines $font $bg $fg $dim
# $inner $outer $check $fail $capslock $wallpaper, plus $faint_hex $accent_hex
# $red_hex for pango markup (in this file a lone `#` starts a comment).

source = ~/.local/state/theme/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 6, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = $wallpaper   # symlink to the wallpaper on screen (wallctl.py keeps it current)
    color = $bg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.2
}

# ── Clock ──────────────────────────────────────────────────────────────

label {
    monitor =
    text = <b>$TIME</b>
    color = $fg
    font_size = 110
    font_family = $font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $dim
    font_size = 17
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 75
    halign = center
    valign = center
}

# ── Password ───────────────────────────────────────────────────────────

label {
    monitor =
    text = Welcome back, <b>$USER</b>
    color = $dim
    font_size = 12
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    rounding = -1
    outline_thickness = 2
    inner_color = $inner
    outer_color = $outer
    check_color = $check
    fail_color = $fail
    capslock_color = $capslock
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="$faint_hex">󰌾   Password</span>
    check_text = <span foreground="$accent_hex">Checking…</span>
    fail_text = <span foreground="$red_hex">$FAIL</span>
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    position = 0, -90
    halign = center
    valign = center
}

# ── Bottom row ─────────────────────────────────────────────────────────

# Now playing (empty when nothing plays); `&` would break pango markup.
# No playerctl --format here: hyprlang reads {{ }} as a maths expression.
label {
    monitor =
    text = cmd[update:2000] t=$(playerctl metadata title 2>/dev/null) && echo "󰎆   $t  ·  $(playerctl metadata artist)" | sed 's/&/\&amp;/g'
    color = $dim
    font_size = 11
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}

# Keyboard layout (us / ara / fr from conf.d/input.lua); click to switch
label {
    monitor =
    text = 󰌌   $LAYOUT[US,AR,FR]
    color = $dim
    font_size = 11
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = -30, 30
    halign = right
    valign = bottom
}
