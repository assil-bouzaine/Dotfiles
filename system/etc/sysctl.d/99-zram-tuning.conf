# Added 2026-11-17. First four values are from the ArchWiki zram page
# ("Optimizing swap on zram"). They make the kernel compress idle app memory
# into zram instead of dropping file cache, so the slow hard drive has to
# re-read files less often. Delete this file to undo (after reboot).
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
# Keep folder/file metadata cached longer (fewer slow disk seeks).
vm.vfs_cache_pressure = 50
# Flush dirty writes smoothly (32 MB / 128 MB) instead of letting 1-2 GB pile up
# and stall the 5400 RPM hard drive during big flushes.
vm.dirty_background_bytes = 33554432
vm.dirty_bytes = 134217728
