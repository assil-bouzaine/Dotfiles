# networkmanager-dmenu (AUR: networkmanager-dmenu-git), opened by the bar's
# Wi-Fi icon. Drawn as the same rofi card as the launcher and Bluetooth menu.
# The bar passes this file with --config, so it lives in the waybar package.

[dmenu]
dmenu_command = rofi -i -theme ~/.config/waybar/scripts/card.rasi -l 8
# Active connection is tinted through rofi's -a (card.rasi: element active)
highlight = True
compact = True
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}   {name}   {sec}
prompt = 󰖩

[dmenu_passphrase]
obscure = True

[editor]
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 4
